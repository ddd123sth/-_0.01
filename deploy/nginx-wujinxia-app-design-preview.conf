# Included only inside this Android project's HTTPS server block.
# Published files are an explicit allowlist of isolated design artifacts.
location = /preview {
    return 302 /preview/;
}

location ^~ /preview/ {
    alias /var/www/wujinxia-app-prototypes/current/;
    index index.html;
    autoindex off;

    limit_except GET HEAD { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/wujinxia-app-preview.access.log;
    error_log /var/log/nginx/wujinxia-app-preview.error.log;
}
