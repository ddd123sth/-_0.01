# 无尽夏安卓端专用云服务入口（本项目自己的站点文件，不改网页版的 garden-world*）
# 回源：garden-node1 上的 wujinxia-app-cloud 通过私有 SSH 隧道映射到本机 127.0.0.1:8091
# 证书：Let's Encrypt，HTTP-01 + 本文件里的 webroot；续期由 certbot 定时器负责

# ① 80：先给 ACME 校验用，签好证书后其余请求一律跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wujinxia01.ainiannian.online;

    location /.well-known/acme-challenge/ {
        root /var/www/wujinxia-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/wujinxia-app-cloud.access.log;
    error_log  /var/log/nginx/wujinxia-app-cloud.error.log;
}

# ② 443：TLS 在本机终结，明文只走回环与隧道
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name wujinxia01.ainiannian.online;

    ssl_certificate     /etc/letsencrypt/live/wujinxia01.ainiannian.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wujinxia01.ainiannian.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WJXSSL:10m;
    ssl_session_timeout 1d;

    # 日志批量上限 256 KiB，留一点余量；其他接口本身很小
    client_max_body_size 1m;

    # 本项目设计预览：独立静态目录，无 API、账号数据或认证依赖。
    include /etc/nginx/wujinxia-app-design-preview.conf;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    access_log /var/log/nginx/wujinxia-app-cloud.access.log;
    error_log  /var/log/nginx/wujinxia-app-cloud.error.log;
}
